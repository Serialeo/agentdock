name: Publish candidate containers

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish candidate (${{ matrix.variant }})
    # 只发布本仓 main push 已通过 CI 的提交，不能让 PR 的 workflow_run 获得发布权限。
    if: >-
      github.repository == 'Serialeo/agentdock' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - variant: runtime
            target: runtime
            tag_prefix: ''
          - variant: dev
            target: dev
            tag_prefix: dev-
          - variant: browser
            target: browser
            tag_prefix: browser-

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve candidate metadata
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          # workflow_run 的 GITHUB_SHA 指向默认分支，镜像必须取实际通过 CI 的源码提交。
          source_sha="$(git rev-parse HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'sha=%s\nshort_sha=%s\nbuild_date=%s\n' "$source_sha" "${source_sha:0:7}" "$build_date" >> "$GITHUB_OUTPUT"

      - name: Build and push candidate image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/serialeo/agentdock:${{ matrix.tag_prefix }}sha-${{ steps.candidate.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.candidate.outputs.sha }}
            org.opencontainers.image.version=${{ matrix.tag_prefix }}sha-${{ steps.candidate.outputs.short_sha }}
          build-args: |
            BUILD_COMMIT=${{ steps.candidate.outputs.sha }}
            BUILD_DATE=${{ steps.candidate.outputs.build_date }}
          cache-from: type=gha,scope=candidate-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=candidate-${{ matrix.variant }},ignore-error=true

      - name: Report candidate digest
        shell: bash
        run: |
          echo "image=ghcr.io/serialeo/agentdock:${{ matrix.tag_prefix }}sha-${{ steps.candidate.outputs.short_sha }}"
          echo "digest=${{ steps.push.outputs.digest }}"

  verify:
    name: Verify candidate variants
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Ensure GHCR verification is anonymous
        run: docker logout ghcr.io >/dev/null 2>&1 || true

      - name: Run candidate image smoke
        shell: bash
        env:
          AGENTDOCK_TEST_BUILD: 'false'
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          short_sha="${source_sha:0:7}"
          export AGENTDOCK_TEST_RUNTIME_IMAGE="ghcr.io/serialeo/agentdock:sha-${short_sha}"
          export AGENTDOCK_TEST_DEV_IMAGE="ghcr.io/serialeo/agentdock:dev-sha-${short_sha}"
          export AGENTDOCK_TEST_BROWSER_IMAGE="ghcr.io/serialeo/agentdock:browser-sha-${short_sha}"
          ./scripts/test/test-docker-images.sh
