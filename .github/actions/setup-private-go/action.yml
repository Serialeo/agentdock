name: Configure private Go module access
description: Configure least-privilege HTTPS access for private Go modules.
inputs:
  token:
    description: Fine-grained token restricted to the required private Go module repositories with Contents read.
    required: true
runs:
  using: composite
  steps:
    - name: Configure private module credential
      shell: bash
      env:
        PRIVATE_GO_READ_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if [[ -z "${PRIVATE_GO_READ_TOKEN}" ]]; then
          echo "PRIVATE_GO_READ_TOKEN is required" >&2
          exit 1
        fi
        umask 077
        printf 'machine github.com login x-access-token password %s\n' "$PRIVATE_GO_READ_TOKEN" > "$HOME/.netrc"
        chmod 0600 "$HOME/.netrc"
        if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
          cp "$HOME/.netrc" "$HOME/_netrc"
          chmod 0600 "$HOME/_netrc" || true
        fi
        {
          echo 'GOPRIVATE=github.com/Serialeo/*'
          echo 'GONOSUMDB=github.com/Serialeo/*'
        } >> "$GITHUB_ENV"
